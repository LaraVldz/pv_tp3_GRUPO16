<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicios Adicionales</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

</head>
<body>
  <h1>Ejercicios con Productos</h1>

  <button onclick="mostrarProductos()">1 - Mostrar productos</button>
  <button onclick="filtrarProductos()">2 - Filtrar productos > $20</button>
  <button onclick="agregarIVA()">3 - Agregar IVA</button>
  <button onclick="ordenarProductos()">4 - Ordenar por precio</button>
  <button onclick="agregarProducto()">5 - Agregar producto</button>
  <button onclick="eliminarMasBarato()">6 - Eliminar producto más barato</button>

  <script src="ProductosServices.js"></script>
</body>
<style>
  /* Estilos globales */
body {
  font-family: 'verdana', sans-serif;
  background-color: #f4f4f9;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100vh;
}

h1 {
  color: #333;
  text-align: center;
  font-size: 2.5em;
  margin-bottom: 30px;
  
}

/* Estilos para los botones */
button {
  font-family: 'Verdana', sans-serif;
  background-color: #ec9c41;
  color: rgb(255, 255, 255);
  font-size: 16px;
  padding: 12px 20px;
  margin: 10px 0;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.3s, transform 0.2s;
  width: 250px;
}


button:hover {
  background-color: #da694d;
  transform: scale(1.05);
}

/* Estilo para los botones cuando están desactivados */
button:disabled {
  background-color: #cccccc;
  cursor: not-allowed;
}


div.buttons-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
}

pre {
  background-color: #333;
  color: #fff;
  padding: 20px;
  border-radius: 8px;
  margin-top: 20px;
  width: 80%;
  max-width: 800px;
  white-space: pre-wrap;
  word-wrap: break-word;
}


</style>
</html>
